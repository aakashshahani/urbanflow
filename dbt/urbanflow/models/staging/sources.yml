version: 2

sources:
  - name: bronze
    description: Raw Iceberg tables landed by the ingestion layer.
    schema: bronze
    tables:
      - name: yellow_trips
        description: Raw NYC TLC yellow taxi trips, one load per _source_month (re-runs replace the month).
        columns:
          - name: tpep_pickup_datetime
            data_tests: [not_null]
          - name: pulocationid
            data_tests: [not_null]
      - name: weather_hourly
        description: Hourly weather observations from Open-Meteo.
        columns:
          - name: observed_at
            data_tests: [not_null, unique]
